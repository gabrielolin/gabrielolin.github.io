set.</span> </figcaption> </figure> <script>
  (() => {
    const figure = document.getElementById('cbf-motion');
    if (!figure) return;

    const button = document.getElementById('cbf-motion-button');
    const hCurve = document.getElementById('cbf-h-curve');
    const hdotCurve = document.getElementById('cbf-hdot-curve');
    const cursor = document.getElementById('cbf-time-cursor');
    const hDot = document.getElementById('cbf-h-dot');
    const hdotDot = document.getElementById('cbf-hdot-dot');
    const robot = document.getElementById('cbf-robot');
    const path = document.getElementById('cbf-avoidance-path');
    const duration = 7000;
    let progress = 0;
    let playing = false;
    let frame = 0;
    let lastTime = null;

    const h = (p) => Math.exp(-3.5 * p);
    const curve = (y) => Array.from({ length: 101 }, (_, i) => {
      const p = i / 100;
      return `${i ? 'L' : 'M'}${(42 + 500 * p).toFixed(2)} ${y(p).toFixed(2)}`;
    }).join(' ');

    hCurve.setAttribute('d', curve((p) => 430 - 144 * h(p)));
    hdotCurve.setAttribute('d', curve((p) => 430 + 105 * h(p)));

    function render() {
      const x = 42 + 500 * progress;
      cursor.setAttribute('x1', x);
      cursor.setAttribute('x2', x);
      hDot.setAttribute('cx', x);
      hDot.setAttribute('cy', 430 - 144 * h(progress));
      hdotDot.setAttribute('cx', x);
      hdotDot.setAttribute('cy', 430 + 105 * h(progress));
      const point = path.getPointAtLength(progress * path.getTotalLength());
      robot.setAttribute('cx', point.x);
      robot.setAttribute('cy', point.y);
    }

    function tick(time) {
      if (lastTime !== null) progress = Math.min(1, progress + (time - lastTime) / duration);
      lastTime = time;
      render();
      if (progress < 1) {
        frame = requestAnimationFrame(tick);
      } else {
        playing = false;
        lastTime = null;
        figure.classList.add('is-complete');
        button.textContent = 'Replay animation';
        button.setAttribute('aria-label', 'Replay safety boundary animation');
      }
    }

    button.addEventListener('click', () => {
      if (playing) {
        cancelAnimationFrame(frame);
        playing = false;
        lastTime = null;
        button.textContent = 'Resume animation';
        button.setAttribute('aria-label', 'Resume safety boundary animation');
        return;
      }
      if (progress === 1) {
        progress = 0;
        render();
        figure.classList.remove('is-complete');
      }
      figure.classList.add('is-started');
      playing = true;
      button.textContent = 'Pause animation';
      button.setAttribute('aria-label', 'Pause safety boundary animation');
      frame = requestAnimationFrame(tick);
    });

    render();
  })();

</style> <figure class="cbf-diff" id="cbf-diff"> <h2>Differentiating Through the Quadratic Program</h2> <p class="diff-subtitle">changing QP parameters changes both the optimization landscape and its solution</p> <div class="diff-stage"> <div class="diff-formula"> <div class="diff-objective"> <span>\(u^*=\arg\min_u\;\tfrac12(u-u_{\rm ref})^\top\)</span> <span class="diff-symbol-slot"> <span class="diff-symbol">\(H_\theta\)</span> <span class="diff-numeric diff-matrix" aria-label="Control weighting matrix"> <span id="cbf-w1">0.63</span><span class="diff-zero">0.00</span> <span class="diff-zero">0.00</span><span id="cbf-w2">1.47</span> </span> </span> <span>\((u-u_{\rm ref})\)</span> </div> <div class="diff-constraint"> <span>\(\begin{gathered}L_fh_1(x)+L_gh_1(x)u\\\vdots\\L_fh_k(x)+L_gh_k(x)u\end{gathered}\)</span> <span>\(\ge -\)</span> <span class="diff-vector-slot"> <span class="diff-symbol">\(\begin{gathered}\alpha_\theta(h_1)\\\vdots\\\alpha_\theta(h_k)\end{gathered}\)</span> <span class="diff-numeric diff-vector" aria-label="Barrier strengths"> <span id="cbf-a1">0.38</span><span class="diff-ellipsis">⋮</span><span id="cbf-ak">1.26</span> </span> </span> </div> <div class="diff-bounds">\(u_{\min}\le u\le u_{\max}\)</div> <div class="diff-result diff-green">\(\theta\longmapsto u^*(\theta)\)</div> <div class="diff-chain-rule">\(\displaystyle\frac{\partial\ell}{\partial\theta}=\left(\frac{\partial\ell}{\partial u^*}\right)^\top\frac{\partial u^*}{\partial\theta}\)</div> </div> <div class="diff-visual" id="cbf-diff-visual"> <svg viewbox="0 0 560 520" role="img" aria-labelledby="cbf-diff-title cbf-diff-desc"> <title id="cbf-diff-title">QP solution changes with the learned parameters</title> <desc id="cbf-diff-desc">Elliptical objective contours and the active safety constraint move as four QP parameters change. The safe solution is the weighted projection of the reference action onto the feasible half-space.</desc> <defs> <clippath id="cbf-diff-clip"><rect x="0" y="0" width="560" height="520"></rect></clippath> <marker id="cbf-diff-arrow" markerwidth="12" markerheight="12" refx="9" refy="6" orient="auto" markerunits="userSpaceOnUse"> <path class="diff-solution" d="M0 0 L12 6 L0 12 Z"></path> </marker> </defs> <g clip-path="url(#cbf-diff-clip)"> <polygon id="cbf-diff-region" class="diff-region"></polygon> <g id="cbf-diff-contours"> <ellipse class="diff-contour" cx="230" cy="265"></ellipse> <ellipse class="diff-contour" cx="230" cy="265"></ellipse> <ellipse class="diff-contour" cx="230" cy="265"></ellipse> <ellipse class="diff-contour" cx="230" cy="265"></ellipse> </g> <line id="cbf-diff-boundary" class="diff-boundary"></line> <line id="cbf-diff-projection" class="diff-projection" marker-end="url(#cbf-diff-arrow)"></line> <circle class="diff-reference" cx="230" cy="265" r="9"></circle> <circle id="cbf-diff-optimum" class="diff-solution" r="9"></circle> </g> <text x="178" y="271" class="diff-svg-label diff-reference">u<tspan baseline-shift="sub" font-size="65%">ref</tspan></text> <text id="cbf-diff-optimum-label" class="diff-svg-label diff-solution">u*</text> <text x="280" y="490" class="diff-svg-caption" fill="var(--diff-gold)" text-anchor="middle">active barrier constraint</text> </svg> </div> </div> <p class="diff-takeaway">Sensitivity Analysis of the KKT system allows us to propagate gradients from u* to some outer loss function</p> <figcaption> <button id="cbf-diff-button" type="button" aria-controls="cbf-diff" aria-label="Play differentiable QP animation">Play animation</button> <span>The learned weights and barrier strengths change the safe control action.</span> </figcaption> </figure> <script>
  (() => {
    const figure = document.getElementById('cbf-diff');
    if (!figure) return;

    const button = document.getElementById('cbf-diff-button');
    const visual = document.getElementById('cbf-diff-visual');
    const contours = [...document.querySelectorAll('#cbf-diff-contours ellipse')];
    const region = document.getElementById('cbf-diff-region');
    const boundary = document.getElementById('cbf-diff-boundary');
    const projection = document.getElementById('cbf-diff-projection');
    const optimum = document.getElementById('cbf-diff-optimum');
    const optimumLabel = document.getElementById('cbf-diff-optimum-label');
    const values = ['cbf-w1', 'cbf-w2', 'cbf-a1', 'cbf-ak'].map((id) => document.getElementById(id));
    const initial = [0.63, 1.47, 0.38, 1.26];
    const target = [1.71, 0.34, 1.12, 0.57];
    const expansionEnd = 1800;
    const motionEnd = 6000;
    const total = 6800;
    let elapsed = 0;
    let playing = false;
    let frame = 0;
    let lastTime = null;

    function point(x, y) {
      return [230 + 78 * (x + 0.82), 265 - 78 * (y - 0.30)];
    }

    function render() {
      const expanded = elapsed >= 550;
      figure.classList.toggle('is-expanded', expanded);
      figure.classList.toggle('is-complete', elapsed >= motionEnd);
      visual.style.opacity = Math.max(0, Math.min(1, (elapsed - 550) / 1200));

      const fraction = Math.max(0, Math.min(1, (elapsed - expansionEnd) / (motionEnd - expansionEnd)));
      const [w1, w2, a1, ak] = initial.map((start, i) => start + fraction * (target[i] - start));
      [w1, w2, a1, ak].forEach((value, i) => { values[i].textContent = value.toFixed(2); });

      [0.55, 0.9, 1.25, 1.6].forEach((level, i) => {
        contours[i].setAttribute('rx', 78 * level / Math.sqrt(w1));
        contours[i].setAttribute('ry', 78 * level / Math.sqrt(w2));
      });

      const angle = 0.18 + 0.28 * (ak - a1);
      const nx = Math.cos(angle);
      const ny = Math.sin(angle);
      const offset = 0.48 + 0.22 * (a1 + ak);
      const tx = -ny;
      const ty = nx;
      const p0 = point(offset * nx - 2.25 * tx, offset * ny - 2.25 * ty);
      const p1 = point(offset * nx + 2.25 * tx, offset * ny + 2.25 * ty);
      const p2 = point(offset * nx + 2.25 * tx + 3.2 * nx, offset * ny + 2.25 * ty + 3.2 * ny);
      const p3 = point(offset * nx - 2.25 * tx + 3.2 * nx, offset * ny - 2.25 * ty + 3.2 * ny);
      region.setAttribute('points', [p0, p1, p2, p3].map((p) => p.join(',')).join(' '));
      boundary.setAttribute('x1', p0[0]);
      boundary.setAttribute('y1', p0[1]);
      boundary.setAttribute('x2', p1[0]);
      boundary.setAttribute('y2', p1[1]);

      const inverseNormal = [nx / w1, ny / w2];
      const scale = (offset - (-0.82 * nx + 0.30 * ny)) / (nx * inverseNormal[0] + ny * inverseNormal[1]);
      const safe = point(-0.82 + scale * inverseNormal[0], 0.30 + scale * inverseNormal[1]);
      optimum.setAttribute('cx', safe[0]);
      optimum.setAttribute('cy', safe[1]);
      optimumLabel.setAttribute('x', safe[0] + 14);
      optimumLabel.setAttribute('y', safe[1] - 10);
      projection.setAttribute('x1', 242);
      projection.setAttribute('y1', 265);
      projection.setAttribute('x2', safe[0] - 16);
      projection.setAttribute('y2', safe[1] + (safe[1] - 265) * 0.06);
    }

    function tick(time) {
      if (lastTime !== null) elapsed = Math.min(total, elapsed + time - lastTime);
      lastTime = time;
      render();
      if (elapsed < total) {
        frame = requestAnimationFrame(tick);
      } else {
        playing = false;
        lastTime = null;
        button.textContent = 'Replay animation';
        button.setAttribute('aria-label', 'Replay differentiable QP animation');
      }
    }

    button.addEventListener('click', () => {
      if (playing) {
        cancelAnimationFrame(frame);
        playing = false;
        lastTime = null;
        button.textContent = 'Resume animation';
        button.setAttribute('aria-label', 'Resume differentiable QP animation');
        return;
      }
      if (elapsed === total) elapsed = 0;
      playing = true;
      lastTime = null;
      render();
      button.textContent = 'Pause animation';
      button.setAttribute('aria-label', 'Pause differentiable QP animation');
      frame = requestAnimationFrame(tick);
    });

    render();
  })();
